<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi - Crabs aquasense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        form p { margin-bottom: 1rem; }
        form label { font-weight: 500; margin-bottom: 0.4rem; display: block; color: #495057; }
        form input {
            display: block;
            width: 100%;
            padding: 0.5rem 0.75rem;
            font-size: 1rem;
            color: #212529;
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
        }
        form input:focus {
            background-color: #fff;
            border-color: #86b7fe;
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(13,110,253,.25);
        }
        form .helptext { font-size: 0.85em; color: #6c757d; display: block; margin-top: 0.25rem; }
        form ul.errorlist { color: #dc3545; list-style: none; padding-left: 0; font-size: 0.875em; margin-bottom: 0.5rem; }
    </style>
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh; padding-top: 2rem; padding-bottom: 2rem;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-md-8 col-lg-5">
                
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-primary">🌊 Crabs aquasense</h2>
                            <p class="text-muted small">Pendaftaran Akses Nelayan Baru</p>
                        </div>

                        <form method="POST">
                            {% csrf_token %}
                            {{ form.as_p }}
                            
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-success btn-lg fw-bold rounded-3">Buat Akun</button>
                            </div>
                        </form>

                        <div class="text-center mt-4">
                            <p class="text-muted small mb-0">Sudah punya akun? 
                                <a href="{% url 'login' %}" class="text-decoration-none fw-bold">Login di sini</a>
                            </p>
                        </div>
                    </div>
                </div>
                </div>
        </div>
    </div>

</body>
</html>
