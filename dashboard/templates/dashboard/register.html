<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi - Crabs aquasense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            background: #f0f4f9;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 0;
        }
        .card-register {
            border: none;
            border-radius: 24px;
            background: white;
            box-shadow: 0 12px 40px rgba(0,0,0,0.06);
            padding: 2rem 2.5rem;
        }
        .card-register h2 {
            font-weight: 700;
            color: #0b2a4a;
        }
        .card-register h2 i {
            color: #198754;
        }
        .card-register .subtitle {
            color: #6c7a8a;
            font-size: 0.95rem;
        }
        /* Form styling */
        form p { margin-bottom: 1.2rem; }
        form label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #2c3e50;
            display: block;
            margin-bottom: 0.3rem;
        }
        form input {
            display: block;
            width: 100%;
            padding: 0.6rem 0.9rem;
            font-size: 1rem;
            color: #1a2634;
            background: #f8faff;
            border: 1px solid #dce3ec;
            border-radius: 12px;
            transition: all 0.25s;
        }
        form input:focus {
            background: #fff;
            border-color: #198754;
            box-shadow: 0 0 0 4px rgba(25,135,84,0.12);
            outline: none;
        }
        form .helptext {
            font-size: 0.8rem;
            color: #8a99a8;
            margin-top: 0.2rem;
        }
        form ul.errorlist {
            color: #dc3545;
            list-style: none;
            padding-left: 0;
            font-size: 0.85rem;
            margin: 0.3rem 0 0.5rem;
        }
        .btn-register {
            background: #198754;
            border: none;
            border-radius: 40px;
            padding: 0.7rem;
            font-weight: 600;
            font-size: 1.1rem;
            color: white;
            width: 100%;
            transition: all 0.25s;
            box-shadow: 0 4px 14px rgba(25,135,84,0.25);
        }
        .btn-register:hover {
            background: #157347;
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(25,135,84,0.35);
            color: white;
        }
        .link-login {
            color: #198754;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }
        .link-login:hover {
            color: #157347;
            text-decoration: underline;
        }
        @media (max-width: 576px) {
            .card-register { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-md-8 col-lg-6">
                <div class="card-register">
                    <div class="text-center mb-4">
                        <h2><i class=""></i> 🌊 Crabs aquasense</h2>
                        <p class="subtitle">Pendaftaran Akun Baru</p>
                    </div>

                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn-register">
                            <i class="bi bi-person-plus me-2"></i> Buat Akun
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted small mb-0">
                            Sudah punya akun? 
                            <a href="{% url 'login' %}" class="link-login">Login di sini</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
